<!doctype html>
<html lang="th" data-theme="default" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ทองหยอด (Thongyod) – กล่องเครื่องมือของเด็กมหาลัย</title>
    <!-- SEO + link previews (LINE / Facebook read these from the HTML; they do not run JavaScript).
         Per-page <title> is set by PageHeader. At deploy: add canonical, og:url, og:image (see docs/HANDOFF.md "Deploy checklist"). -->
    <meta name="description" content="ทองหยอด แอปกล่องเครื่องมือของเด็กมหาลัย: ชวนเพื่อนนัด หารบิลแบบจดระหว่างกิน วงล้อสุ่ม เซียมซี และสัตว์เลี้ยงตัวน้อย ใช้คนเดียวก็ได้ ชวนเพื่อนก็แค่แตะเดียว" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ทองหยอด" />
    <meta property="og:title" content="ทองหยอด – กล่องเครื่องมือของเด็กมหาลัย" />
    <meta property="og:description" content="ชวนเพื่อนนัด หารบิล วงล้อสุ่ม เซียมซี และสัตว์เลี้ยงตัวน้อย ในแอปเดียว" />
    <meta property="og:locale" content="th_TH" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Runs before the page draws, so there is no flash of the wrong theme.
      // data-mode: the user's saved choice "light" / "dark", or "system" (default) = follow the device, live.
      // data-theme: the user's saved choice ("default" or "cute").
      // Keep the storage keys in sync with src/lib/theme.ts.
      ;(function () {
        var root = document.documentElement
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        function saved(key) {
          try {
            return localStorage.getItem(key)
          } catch (e) {
            return null
          }
        }
        function applyMode() {
          var choice = saved('thongyod-mode')
          root.dataset.mode = choice === 'light' || choice === 'dark' ? choice : media.matches ? 'dark' : 'light'
        }
        applyMode()
        media.addEventListener('change', applyMode)
        root.dataset.theme = saved('thongyod-theme') === 'cute' ? 'cute' : 'default'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
