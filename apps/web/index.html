<!doctype html>
<html lang="th" data-theme="default" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Thongyod</title>
    <script>
      // Runs before the page draws, so there is no flash of the wrong theme.
      // data-mode follows the device's light/dark setting and updates live.
      // data-theme is the user's saved choice ("default" or "cute").
      ;(function () {
        var root = document.documentElement
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        function applyMode() {
          root.dataset.mode = media.matches ? 'dark' : 'light'
        }
        applyMode()
        media.addEventListener('change', applyMode)
        try {
          root.dataset.theme = localStorage.getItem('thongyod-theme') === 'cute' ? 'cute' : 'default'
        } catch (e) {
          root.dataset.theme = 'default'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
